[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "autonomousim"
description = "3D simulator for training autonomous aerial and ground vehicles"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["version"]
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.3,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mcap>=1.4",
    "pettingzoo>=1.25",
]
# Reference implementations used only to generate test fixtures (tools/gen_*_fixtures.py).
oracle = [
    "pin>=3",
]
train = [
    "torch>=2.14",
    "tensorboard>=2.18",
]

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
python-source = "python"
module-name = "autonomousim._native"
features = ["pyo3/extension-module", "pyo3/abi3-py312"]

[tool.uv]
default-groups = ["dev"]
# Rebuild the native extension whenever Rust sources or manifests change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

# CPU-only torch wheels on the laptop; the desktop uses a ROCm index (see docs/PLAN.md).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests_py"]
