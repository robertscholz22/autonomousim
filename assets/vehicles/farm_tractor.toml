# 100 kW four-wheel-drive farm tractor: rigid rear axle, front axle on a pendulum pivot, big
# agricultural tyres, rear pintle hitch for drawbar trailers.
type = "wheeled"
name = "farm_tractor"
source = """
Estimated from published figures for 100 kW (136 hp) standard tractors: 6 t in working order \
with 40 % on the front axle, 2.8 m wheelbase, 1.9 m track, 480/65 R28 front and 600/65 R38 \
rear tyres (Fiala tyres with agricultural-tyre stiffnesses), 610 N·m peak torque, 40 km/h top \
speed. The frame origin is the rear axle centre. The rear axle is rigid; the front axle swings \
on a pivot (spring rate per wheel with anti_roll = −rate/2: no roll stiffness, the tyres alone \
carry the axle's roll). No Chrono counterpart."""

[chassis]
mass = 4540.0
com = [1.073, 0.0, 0.202]
inertia = [3030.0, 9180.0, 9180.0]
drag_area = [3.0, 6.0, 8.0]

[steering]
max_angle = 0.8
rate = 0.8
ackermann = 1.0

[hitch]
kind = "drawbar"
position = [-1.2, 0.0, -0.3]            # pintle 0.55 m above the ground

[[axles]]
name = "front"
position = [2.8, 0.95, -0.206]
steer = 1.0
wheel = { mass = 180.0, inertia = [28.0, 48.0, 28.0] }
brake = { max_torque = 2000.0 }

[axles.tire.fiala]
radius = 0.667
width = 0.48
vertical_stiffness = 4.5e5
vertical_damping = 2500.0
slip_stiffness = 1.6e5
cornering_stiffness = 9.0e4
mu = 0.8
rolling_resistance = 0.02
nominal_load = 13000.0
relaxation_x = 0.5
relaxation_y = 0.7

[axles.suspension]
carrier_mass = 150.0                    # half the axle beam and the hub
carrier_inertia = [10.0, 5.0, 10.0]
spring = { rate = 1.5e5 }
damper = { bump = 8000.0, rebound = 8000.0 }
anti_roll = -7.5e4                      # pendulum axle
bump_stop = { travel = 0.1, stiffness = 1.0e6 }
rebound_stop = { travel = -0.1, stiffness = 1.0e6 }

[[axles]]
name = "rear"
position = [0.0, 0.95, 0.0]
wheel = { mass = 400.0, inertia = [100.0, 182.0, 100.0] }
brake = { max_torque = 6000.0, parking_torque = 5000.0 }

[axles.tire.fiala]
radius = 0.873
width = 0.6
vertical_stiffness = 6.0e5
vertical_damping = 3500.0
slip_stiffness = 2.5e5
cornering_stiffness = 1.3e5
mu = 0.8
rolling_resistance = 0.02
nominal_load = 20000.0
relaxation_x = 0.6
relaxation_y = 0.9

[powertrain]
type = "combustion"
driven = [0, 1]
split = [0.4, 0.6]
final_drive = 0.058
driveline_inertia = 20.0
axle_differential = "open"
center_differential = "open"

[powertrain.engine]
max_rpm = 2200.0
full_throttle = [[-10, 300], [800, 450], [1000, 520], [1300, 600], [1500, 610], [1800, 580],
    [2000, 520], [2100, 470], [2200, 0]]
zero_throttle = [[-10, 0], [10, 0], [1000, -40], [2000, -70], [2200, -100]]

[powertrain.gearbox]
forward = [0.06, 0.09, 0.13, 0.19, 0.28, 0.42, 0.63, 1.0]
reverse = -0.1
shift = [[800, 2000], [1000, 2000], [1000, 2000], [1000, 2000], [1000, 2000], [1000, 2000],
    [1000, 2000], [1000, 2100]]

# Hood, cab and hitch frame (the ground is ≈ 0.85 m below the frame origin).
[[colliders]]
center = [2.6, 0.0, 0.35]
radius = 0.5

[[colliders]]
center = [0.3, 0.0, 1.2]
radius = 0.9

[[colliders]]
center = [-0.8, 0.0, 0.1]
radius = 0.35
