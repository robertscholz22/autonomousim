# 6×4 semitrailer tractor after the Chrono::Vehicle Kraz 64431 model (solid leaf-spring axles,
# dual tyres on the driven rear tandem, SimpleMap engine and 7-speed automatic), fitted with the
# 315/80 R22.5 PAC2002 truck tyre.
type = "wheeled"
name = "truck_6x4"
source = """
Masses, inertias, axle and fifth-wheel positions, spring and damper rates, steering lock, \
brakes, engine maps, gear ratios and shift points from Project Chrono's Kraz model \
(src/chrono_models/vehicle/kraz, BSD-3-Clause, Copyright (c) 2014 projectchrono.org). The \
chassis frame is Chrono's; wheel positions are its static spindle positions with the truck tyre \
(tools/gen_chrono_truck_fixtures.py), so the springs carry the static load at zero travel. The \
solid axles are equivalent independent wheels: wheel rate = leaf-spring rate, a negative \
anti-roll rate k((s/t)² − 1)/2 for the springs' spread s over the track t, dampers through \
their motion ratio in bounce. Steering: Chrono's full-lock wheel angles (25.0° inside, 23.3° \
outside) as a bicycle angle with a partial Ackermann fraction. Air-brake timing, steering rate, \
parking brake, drag and colliders are estimates."""

[chassis]
mass = 10001.6                          # body and pitman arm
com = [-2.0, 0.0, 0.8]
inertia = [3441.0, 28485.0, 29395.0]
drag_area = [5.5, 12.0, 15.0]           # estimate

[steering]
max_angle = 0.421                       # 24.1°: 25.0° / 23.3° at the road wheels
rate = 0.3
ackermann = 0.45

[hitch]
kind = "fifth_wheel"
position = [-4.64, 0.0, 0.82]

[[axles]]
name = "front"
position = [0.0, 0.919, -0.01657]
steer = 1.0
wheel = { mass = 98.6, inertia = [6.704, 12.174, 6.704] }       # rim, tyre, axle shaft
tire = { tir = { file = "Truck_Pac02Tire" } }
brake = { max_torque = 10000.0, delay = 0.1, time_constant = 0.15 }

[axles.suspension]
carrier_mass = 378.2                    # half the axle tube, spindle, knuckle, tie rod, drag link
carrier_inertia = [20.0, 5.0, 20.0]
spring = { rate = 592176.3 }
damper = { bump = 74305.0, rebound = 74305.0, degressivity_bump = 2.664, degressivity_rebound = 0.888 }
anti_roll = -197981.0                   # springs at ±0.529 m on a 1.838 m track
bump_stop = { travel = 0.0966, stiffness = 2.5e5 }
rebound_stop = { travel = -0.0634, stiffness = 2.5e5 }

[[axles]]
name = "rear 1"
position = [-4.08, 0.83236, -0.04571]
dual = 0.33528
wheel = { mass = 197.2, inertia = [18.95, 23.948, 18.95] }
tire = { tir = { file = "Truck_Pac02Tire" } }
brake = { max_torque = 10000.0, parking_torque = 10000.0, delay = 0.1, time_constant = 0.15 }

[axles.suspension]
carrier_mass = 373.2
carrier_inertia = [20.0, 5.0, 20.0]
spring = { rate = 1026438.9 }
damper = { bump = 143106.0, rebound = 143106.0, degressivity_bump = 2.808, degressivity_rebound = 0.936 }
anti_roll = -376888.0                   # springs at ±0.429 m on a 1.665 m track
bump_stop = { travel = 0.1257, stiffness = 2.5e5 }
rebound_stop = { travel = -0.0343, stiffness = 2.5e5 }

[[axles]]
name = "rear 2"
position = [-5.48, 0.83236, -0.05695]
dual = 0.33528
wheel = { mass = 197.2, inertia = [18.95, 23.948, 18.95] }
tire = { tir = { file = "Truck_Pac02Tire" } }
brake = { max_torque = 10000.0, parking_torque = 10000.0, delay = 0.1, time_constant = 0.15 }

[axles.suspension]
carrier_mass = 373.2
carrier_inertia = [20.0, 5.0, 20.0]
spring = { rate = 1026438.9 }
damper = { bump = 143106.0, rebound = 143106.0, degressivity_bump = 2.808, degressivity_rebound = 0.936 }
anti_roll = -376888.0
bump_stop = { travel = 0.137, stiffness = 2.5e5 }
rebound_stop = { travel = -0.023, stiffness = 2.5e5 }

[powertrain]
type = "combustion"
driven = [1, 2]
final_drive = 0.1625                    # 1:6.154
driveline_inertia = 62.0                # shafts and differential boxes, referred to the wheels
axle_differential = "open"
center_differential = "open"

[powertrain.engine]
max_rpm = 2700.0
full_throttle = [[-100, 645.4], [500, 634.8], [1000, 793.5], [1200, 907.8], [1400, 1053.8],
    [1600, 1131.5], [1800, 1163.3], [2000, 1150.6], [2100, 1137.9], [2200, 1122.0], [2300, 1082.3],
    [2400, -1269.6], [2500, -430.4]]
zero_throttle = [[-100, 0], [800, -20], [1000, -20], [1200, -30], [1400, -30], [1600, -30],
    [1800, -40], [2000, -50], [2200, -70], [2400, -100], [2700, -800]]

[powertrain.gearbox]
forward = [0.162337662, 0.220750552, 0.283286119, 0.414937759, 0.571428571, 0.78125, 1.0]
reverse = -0.162337662
shift = [[1000, 2226], [1000, 2226], [1000, 2225], [1000, 2210], [1000, 2226], [1000, 2225], [1000, 2700]]

# Bumper, cab and frame (the ground is ≈ 0.53 m below the frame origin).
[[colliders]]
center = [1.3, 0.0, 0.3]
radius = 0.5

[[colliders]]
center = [0.3, 0.0, 1.4]
radius = 1.0

[[colliders]]
center = [-2.5, 0.0, 0.1]
radius = 0.35

[[colliders]]
center = [-6.2, 0.0, 0.1]
radius = 0.3
