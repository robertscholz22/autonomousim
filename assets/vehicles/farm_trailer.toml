# Two-axle farm drawbar trailer, 10 t gross: a turntable dolly under the front of the body.
type = "trailer"
name = "farm_trailer"
source = """
Estimated from published figures for 10 t two-axle farm trailers: 4.2 m wheelbase, 1.9 m \
track, 385/65 R22.5 tyres (Fiala), leaf springs, 8.6 t body with its load. The body's frame \
coincides with the dolly's (at the front axle centre) at design. No Chrono counterpart."""

[coupling]
kind = "drawbar"
position = [2.6, 0.0, 0.03]             # eye 0.55 m above the ground

[chassis]
mass = 8600.0
com = [-2.1, 0.0, 1.3]
inertia = [5700.0, 27400.0, 29900.0]
drag_area = [3.0, 10.0, 12.0]

[[axles]]
name = "rear"
position = [-4.2, 0.95, 0.0]
wheel = { mass = 120.0, inertia = [10.0, 17.0, 10.0] }
brake = { max_torque = 5000.0, delay = 0.25, time_constant = 0.25 }

[axles.tire.fiala]
radius = 0.536
width = 0.385
vertical_stiffness = 9.0e5
vertical_damping = 3000.0
slip_stiffness = 2.5e5
cornering_stiffness = 1.8e5
mu = 0.8
nominal_load = 25000.0
relaxation_x = 0.4
relaxation_y = 0.6

[axles.suspension]
carrier_mass = 100.0
carrier_inertia = [10.0, 5.0, 10.0]
spring = { rate = 3.0e5 }
damper = { bump = 1.0e4, rebound = 1.5e4 }
bump_stop = { travel = 0.08, stiffness = 2.0e6 }
rebound_stop = { travel = -0.08, stiffness = 2.0e6 }

[[colliders]]
center = [-2.1, 0.8, 1.0]
radius = 0.5

[[colliders]]
center = [-2.1, -0.8, 1.0]
radius = 0.5

[[colliders]]
center = [-5.2, 0.0, 1.0]
radius = 0.5

[dolly]
chassis = { mass = 400.0, com = [0.0, 0.0, 0.2], inertia = [150.0, 150.0, 250.0] }
hinge = [0.7, 0.0, 0.0]
drawbar_mass = 60.0
turntable = [0.0, 0.0, 0.45]
mount = [0.0, 0.0, 0.45]

[[dolly.axles]]
name = "dolly"
position = [0.0, 0.95, 0.0]
wheel = { mass = 120.0, inertia = [10.0, 17.0, 10.0] }
brake = { max_torque = 5000.0, delay = 0.25, time_constant = 0.25 }

[dolly.axles.tire.fiala]
radius = 0.536
width = 0.385
vertical_stiffness = 9.0e5
vertical_damping = 3000.0
slip_stiffness = 2.5e5
cornering_stiffness = 1.8e5
mu = 0.8
nominal_load = 25000.0
relaxation_x = 0.4
relaxation_y = 0.6

[dolly.axles.suspension]
carrier_mass = 100.0
carrier_inertia = [10.0, 5.0, 10.0]
spring = { rate = 3.0e5 }
damper = { bump = 1.0e4, rebound = 1.5e4 }
bump_stop = { travel = 0.08, stiffness = 2.0e6 }
rebound_stop = { travel = -0.08, stiffness = 2.0e6 }
