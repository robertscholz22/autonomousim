# Four-wheel-drive off-road utility vehicle after the Chrono::Vehicle HMMWV (double wishbones
# with progressive springs, SimpleMap diesel and 6-speed automatic, open differentials,
# Pacejka 2002 tyres).
type = "wheeled"
name = "offroad_4x4"
source = """
Masses, inertias, suspension kinematics (spindle path, toe and camber over travel), spring \
force over travel, dampers, brakes, steering lock, engine maps, gear ratios and shift points \
derived from Project Chrono's data/vehicle/hmmwv, HMMWV_Vehicle_4WD (BSD-3-Clause, Copyright \
(c) 2014 projectchrono.org) by settling the Chrono model under scaled gravity \
(tools/gen_chrono_vehicle_fixtures.py). The wheel positions are Chrono's static spindle \
positions in its chassis frame. Aerodynamic drag, steering rate, parking brake, end stops and \
colliders are estimates (Chrono models none of them)."""

[chassis]
mass = 2151.362
com = [0.0576, 0.0, 0.2066]
inertia = [1102.54, 3143.88, 3775.67]
drag_area = [1.9, 5.0, 6.0]             # estimate: C_d ≈ 0.55 at 3.4 m²

[steering]
max_angle = 0.477                       # inner 30.6°, outer 24.1°
rate = 1.0
ackermann = 1.0

[[axles]]
name = "front"
position = [1.65685, 0.87488, -0.12831]
steer = 1.0
wheel = { mass = 56.4, inertia = [4.34, 7.79, 4.34] }
tire = { tir = { file = "HMMWV_Pac02Tire" } }
brake = { max_torque = 4000.0 }

[axles.suspension]
carrier_mass = 49.04
carrier_inertia = [0.5, 0.5, 0.5]
damper = { bump = 4581.0, rebound = 4581.0 }
bump_stop = { travel = 0.10, stiffness = 1.0e6 }
rebound_stop = { travel = -0.10, stiffness = 1.0e6 }

[axles.suspension.spring]
