# 6 kg quad tiltrotor UAV in the manner of PX4's tiltrotor VTOL airframes: a 2.2 m wing with
# flaperons, a conventional tail and four 15" propellers on mounts that tilt from up to forward.
type = "tiltrotor"
name = "quadtilt_like"
source = """
Estimates for a small electric quad tiltrotor (no single published aircraft): mass and inertia \
from a component build-up (four 250 g motor pods, 1 kg wing, 3 kg fuselage and payload); wing \
area 0.6 m², aspect ratio 8.1, a cambered section (c_l0 0.25, c_m0 −0.05, 14° stall), so the \
flaps-up stall speed is about 11.5 m/s and cruise 18–22 m/s. Propeller coefficients C_T(J), \
C_Q(J) of the Aerosonde propeller in Beard & McLain's supplement (uavbook) on a 0.38 m disc; \
motors 400 rpm/V, 0.08 ohm, 0.8 A no-load on 6S (22.2 V), 45 A controllers: hover near 490 \
rad/s (about 60 % throttle), thrust-to-weight about 2.5."""
rotor_drag = 2.0e-4

[body]
mass = 6.0
inertia = [0.8, 0.75, 1.45]

[fuselage]
drag_area = [0.02, 0.08, 0.1]

# Wing panels with flaperons, each with the whole wing's aspect ratio.
[[surfaces]]
name = "wing_left"
area = 0.3
span = 1.1
chord = 0.273
aspect_ratio = 8.07
position = [0.02, 0.55, 0.05]
incidence = 0.03
cl0 = 0.25
cm0 = -0.05
alpha_stall = 0.2443
cd0 = 0.01
oswald = 0.85
flap = { chord_fraction = 0.25, max_deflection = 0.35 }

[[surfaces]]
name = "wing_right"
area = 0.3
span = 1.1
chord = 0.273
aspect_ratio = 8.07
position = [0.02, -0.55, 0.05]
incidence = 0.03
cl0 = 0.25
cm0 = -0.05
alpha_stall = 0.2443
cd0 = 0.01
oswald = 0.85
flap = { chord_fraction = 0.25, max_deflection = 0.35 }

[[surfaces]]
name = "tailplane"
area = 0.12
span = 0.6
chord = 0.2
position = [-1.0, 0.0, 0.05]
flap = { chord_fraction = 0.35, max_deflection = 0.4 }

[[surfaces]]
name = "fin"
area = 0.06
span = 0.3
chord = 0.2
position = [-1.0, 0.0, 0.17]
roll = 1.5708
flap = { chord_fraction = 0.35, max_deflection = 0.4 }

# Hobby servos (≈ 0.1 s/60°); tilt servos turn the pods through 90° in about 1.3 s.
[controls]
aileron = { min = -0.35, max = 0.35, rate = 6.0, tau = 0.02 }
elevator = { min = -0.35, max = 0.35, rate = 6.0, tau = 0.02 }
rudder = { min = -0.35, max = 0.35, rate = 6.0, tau = 0.02 }
tilt = { min = -0.15, max = 1.5708, rate = 1.2, tau = 0.05 }

[[controls.mixing]]
surface = "wing_left"
aileron = 1.0

[[controls.mixing]]
surface = "wing_right"
aileron = -1.0

[[controls.mixing]]
surface = "tailplane"
elevator = -1.0

[[controls.mixing]]
surface = "fin"
rudder = -1.0

# Diagonal pairs turn the same way (front left and rear right clockwise seen from above).
[[rotors]]
name = "front_left"
pivot = [0.45, 0.6, 0.05]
offset = 0.1
sense = -1

[[rotors]]
name = "front_right"
pivot = [0.45, -0.6, 0.05]
offset = 0.1
sense = 1

[[rotors]]
name = "rear_left"
pivot = [-0.45, 0.6, 0.05]
offset = 0.1
sense = 1

[[rotors]]
name = "rear_right"
pivot = [-0.45, -0.6, 0.05]
offset = 0.1
sense = -1

[propeller]
diameter = 0.38
inertia = 5.0e-4
ct = { poly = [0.09357, -0.06044, -0.1079] }
cq = { poly = [0.005230, 0.004970, -0.01664] }

[motor]
kv = 400.0
resistance = 0.08
no_load_current = 0.8
max_current = 45.0
voltage = 22.2

# Four landing legs, then nose, tail, wing tips, fuselage and the rotor pods.
[[colliders]]
center = [0.3, 0.25, -0.2]
radius = 0.03
part = "gear"

[[colliders]]
center = [0.3, -0.25, -0.2]
radius = 0.03
part = "gear"

[[colliders]]
center = [-0.3, 0.25, -0.2]
radius = 0.03
part = "gear"

[[colliders]]
center = [-0.3, -0.25, -0.2]
radius = 0.03
part = "gear"

[[colliders]]
center = [0.55, 0.0, 0.0]
radius = 0.08
part = "frame"

[[colliders]]
center = [-1.0, 0.0, 0.05]
radius = 0.06
part = "frame"

[[colliders]]
center = [0.02, 1.1, 0.05]
radius = 0.05
part = "frame"

[[colliders]]
center = [0.02, -1.1, 0.05]
radius = 0.05
part = "frame"

[[colliders]]
center = [0.0, 0.0, 0.0]
radius = 0.12
part = "frame"

[[colliders]]
center = [0.45, 0.6, 0.05]
radius = 0.22
part = "rotor"

[[colliders]]
center = [0.45, -0.6, 0.05]
radius = 0.22
part = "rotor"

[[colliders]]
center = [-0.45, 0.6, 0.05]
radius = 0.22
part = "rotor"

[[colliders]]
center = [-0.45, -0.6, 0.05]
radius = 0.22
part = "rotor"
