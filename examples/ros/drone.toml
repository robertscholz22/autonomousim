# The ROS 2 example's scenario (examples/ros/README.md): a quadrotor with an IMU, GPS, a
# barometer and a 16-ring LiDAR looking down at a field of pillars, flown through `cmd_vel`
# (velocity setpoints) by examples/ros/waypoints.py.
name = "ros_example"
physics_hz = 500
policy_hz = 50
map = { type = "testworld", kind = "pillars", count = 5, spacing = 12.0, radius = 0.5, height = 5.0 }

[[groups]]
name = "drone"
vehicle = "iris_like"
action_mode = "velocity"
# In the corner outside the pillars (−24 … 24 m), so that the waypoints stay over the map.
spawn = { agl = [1.0, 1.0], region = [[-32.0, -32.0], [-30.0, -30.0]] }
sensors = [
    { name = "imu", type = "imu", rate_hz = 250 },
    { name = "gps", type = "gps" },
    { name = "baro", type = "baro" },
    { name = "lidar", type = "lidar", rate_hz = 10, max_range = 60.0, pattern = { type = "rings", elevations = [-60.0, -56.0, -52.0, -48.0, -44.0, -40.0, -36.0, -32.0, -28.0, -24.0, -20.0, -16.0, -12.0, -8.0, -4.0, 0.0], azimuths = 360, azimuth_fov = 360.0 } },
]
